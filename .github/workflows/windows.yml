name: Windows build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch and verify pinned engine
        shell: pwsh
        run: ./prepare-engine.ps1
      - name: Build .NET Framework application
        shell: pwsh
        run: ./build.ps1
      - name: Run regression and WPF interface checks
        shell: pwsh
        run: ./test.ps1
      - name: Keep verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-checks
          path: out/checks/
          retention-days: 7
          if-no-files-found: warn
